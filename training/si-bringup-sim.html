<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SI Bring-up Sim</title>
<style>
/* Same look as rack1-install-sim.html: phase rail across the top, cluster view left, task card right, stacked on a phone.
   No web fonts or CDNs: this file must work offline in the lab. */
:root{
  --bg:#e7ebe9; --surface:#ffffff; --surface-2:#f2f5f3; --ink:#192024; --muted:#56646d; --line:#c9d1ce;
  --tape:#f1c232; --tape-ink:#1a1f23; --accent:#2462c7;
  --ok:#2b8553; --ok-bg:#e3f2e9; --bad:#bf3328; --bad-bg:#f8e4e1; --warn:#b7791f; --off:#9aa5ad;
  --term:#14191c; --term-ink:#d5dde1; --term-dim:#7f8d95; --term-ok:#5fd38d; --term-bad:#ff8a7e; --term-cmd:#f1c232;
  --font-display: Bahnschrift, "DIN Alternate", "DIN 2014", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111518; --surface:#192025; --surface-2:#1f272d; --ink:#e4e9ec; --muted:#93a1aa; --line:#2e3940; --accent:#5b8ff0;
  --ok:#4cb87c; --ok-bg:#16291f; --bad:#ef6b5f; --bad-bg:#2f1714; --warn:#e0a63f; --off:#4d555b;
  --term:#0a0d0f; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#111518; --surface:#192025; --surface-2:#1f272d; --ink:#e4e9ec; --muted:#93a1aa; --line:#2e3940; --accent:#5b8ff0;
  --ok:#4cb87c; --ok-bg:#16291f; --bad:#ef6b5f; --bad-bg:#2f1714; --warn:#e0a63f; --off:#4d555b;
  --term:#0a0d0f; color-scheme: dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px 40px}
button{font:inherit; color:inherit}
code,.mono{font-family:var(--font-mono); font-size:.88em}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

header.top{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; justify-content:space-between; max-width:1280px; margin:0 auto 12px}
.brand h1{font:700 30px/1 var(--font-display); letter-spacing:.01em; margin:0; text-wrap:balance}
.brand p{margin:4px 0 0; color:var(--muted); font-size:13px}
.stats{display:flex; gap:18px; font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums}
.stats b{display:block; font:700 22px/1 var(--font-display)}
.stats .bad b{color:var(--bad)}

.rail{max-width:1280px; margin:0 auto 8px; display:grid; grid-template-columns:repeat(9, minmax(0,1fr)); gap:4px}
.rail button{font:600 11px/1.2 var(--font-display); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:left;
  background:none; border:0; border-top:4px solid var(--line); padding:6px 0 4px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer}
.rail button:hover{color:var(--ink)}
.rail button.done{border-color:var(--ok); color:var(--ink)}
.rail button.now{border-color:var(--tape); color:var(--ink)}
.rail button span{font-family:var(--font-mono); margin-right:4px}
.jumpbar{max-width:1280px; margin:0 auto 16px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:13px; color:var(--muted)}
.jumpbar select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:4px 6px; max-width:100%; min-width:0}

main{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:minmax(0, 500px) minmax(0, 1fr); gap:20px; align-items:start}
@media (max-width: 900px){ main{grid-template-columns:minmax(0,1fr)} .rail button{font-size:0} .rail button span{font-size:11px} }

.scene{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px; position:sticky; top:12px}
@media (max-width: 900px){ .scene{position:static} .task{order:-1} }
.scene-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.scene-head h2{font:700 15px/1.2 var(--font-display); text-transform:uppercase; letter-spacing:.05em; margin:0}
.scene-head span{font:12px var(--font-mono); color:var(--muted)}

.nodes{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (max-width:420px){ .nodes{grid-template-columns:1fr} }
.node{border:1px solid var(--line); border-radius:5px; padding:8px; background:var(--surface-2); min-width:0}
.node.gpu{grid-column:1 / -1}
.node h3{margin:0; display:flex; justify-content:space-between; gap:6px; font:700 14px/1.3 var(--font-display); text-transform:uppercase; letter-spacing:.04em}
.node .role{font:11px var(--font-mono); color:var(--muted)}
.pill{font:600 10px/1 var(--font-mono); padding:3px 6px; border-radius:3px; background:var(--off); color:#fff; white-space:nowrap; text-transform:none; letter-spacing:0}
.pill.ok{background:var(--ok)} .pill.bad{background:var(--bad)} .pill.warn{background:var(--warn)}
.labels{display:flex; flex-wrap:wrap; gap:3px; margin:4px 0}
.labels span{font:10px/1 var(--font-mono); border:1px dashed var(--muted); border-radius:3px; padding:2px 4px; color:var(--muted)}
.pods{list-style:none; margin:4px 0 0; padding:0; font:11px/1.5 var(--font-mono)}
.pods li{display:flex; gap:6px; align-items:center; min-width:0}
.pods li i{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none}
.pods li.warn i{background:var(--warn)} .pods li.bad i{background:var(--bad)}
.pods li b{font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pods li em{margin-left:auto; font-style:normal; color:var(--muted)}
.gpus{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:4px; margin:6px 0}
.g{border-radius:4px; padding:5px 4px; font:10px/1.3 var(--font-mono); text-align:center; background:var(--surface); border:1px solid var(--line); min-width:0}
.g b{display:block; font:700 11px var(--font-display)}
.g.run{border-color:var(--ok); box-shadow:inset 0 -3px 0 var(--ok)} .g.load{border-color:var(--warn); box-shadow:inset 0 -3px 0 var(--warn)}
.g.none{opacity:.55}

.term{margin-top:10px; background:var(--term); color:var(--term-ink); border-radius:5px; padding:8px 10px; font:12px/1.45 var(--font-mono);
  height:230px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere}
.term .p{color:var(--term-cmd)} .term .d{color:var(--term-dim)} .term .ok{color:var(--term-ok)} .term .bad{color:var(--term-bad)}
.note{font-size:11px; color:var(--muted); margin:4px 0 0}

.task{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:18px 20px; min-width:0}
.eyebrow{font:600 12px/1 var(--font-display); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap}
.eyebrow .ref{font-family:var(--font-mono); text-transform:none; letter-spacing:0}
.eyebrow .fault{color:var(--bad)}
.task h2{font:700 26px/1.15 var(--font-display); margin:6px 0 10px; text-wrap:balance}
.task p{margin:0 0 10px; max-width:68ch}
.lead{color:var(--muted)}
.task pre{background:var(--term); color:var(--term-ink); border-radius:5px; padding:8px 10px; font:12px/1.45 var(--font-mono); white-space:pre-wrap; overflow-wrap:anywhere; margin:8px 0 12px}

.opts{display:grid; gap:8px; margin:12px 0}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:10px 12px; cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt[disabled]{cursor:default; opacity:.55}
.opt.right{border-color:var(--ok); background:var(--ok-bg); opacity:1}
.opt .k{font:700 12px/1.6 var(--font-mono); color:var(--muted); min-width:1.4em}
.opt code{overflow-wrap:anywhere}
.opt.chk[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink)}

.feedback{border-radius:5px; padding:10px 12px; margin:10px 0; font-size:14px; max-width:72ch}
.feedback.bad{background:var(--bad-bg); border:1px solid var(--bad)}
.feedback.ok{background:var(--ok-bg); border:1px solid var(--ok)}
.feedback b.t{display:block; font:700 13px/1.3 var(--font-display); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px}

.primary{background:var(--ink); color:var(--surface); border:0; border-radius:4px; padding:9px 18px; font-weight:600; cursor:pointer}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}

.facts{margin-top:18px; border-top:1px dashed var(--line); padding-top:10px}
.facts h3,.subh{font:700 12px/1 var(--font-display); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 6px}
.facts ul{margin:0; padding-left:18px; font-size:13px; color:var(--muted)}
.facts li{margin:2px 0}

.done-list{list-style:none; padding:0; margin:8px 0; display:grid; gap:4px}
.done-list li{display:flex; gap:10px; font-size:14px; padding:6px 10px; background:var(--ok-bg); border-radius:4px}
.done-list li span{font:700 13px/1.5 var(--font-mono); color:var(--ok)}

.intro-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px; margin:12px 0}
.intro-grid div{background:var(--surface-2); border-radius:5px; padding:10px 12px; font-size:13px}
.intro-grid b{display:block; font:700 13px/1.3 var(--font-display); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px}

.misslog{font-size:13px; margin:8px 0; padding-left:18px}
.misslog li{margin:4px 0}
.grade{font:700 44px/1 var(--font-display)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>SI Bring-up Sim</h1>
    <p>Picks up where the <a href="rack1-install-sim.html">Rack 1 Install Sim</a> ends · follows <a href="../docs/software/06-software-delivery.md">06 Software delivery</a> and <a href="../docs/software/11-sandbox-bringup-plan.md">11 Sandbox bring-up plan</a></p>
  </div>
  <div class="stats" aria-live="polite">
    <div>Step<b id="st-step">1/1</b></div>
    <div class="bad">Mistakes<b id="st-miss">0</b></div>
    <div>Time<b id="st-time">0:00</b></div>
  </div>
</header>
<nav class="rail" id="rail" aria-label="Phases (click to jump)"></nav>
<div class="jumpbar"><label for="jump">Jump to</label><select id="jump"></select><span>Earlier steps are filled in for you. Mistakes count from where you land.</span></div>
<main>
  <section class="scene" aria-label="Cluster view">
    <div class="scene-head"><h2>Cluster</h2><span id="scene-sub"></span></div>
    <div class="nodes" id="nodes"></div>
    <div class="term" id="term" aria-label="Console" tabindex="0"></div>
    <p class="note">Console output is shortened for the sim.</p>
  </section>
  <section class="task" id="task" aria-live="polite"></section>
</main>

<script>
"use strict";
/* ---------- data ---------- */
const PHASES = ["Intake","Cluster","GPU node","Platform","SI apps","Keys","Checks","Users","Hand-over"];
const DOC = { "05":"../docs/hardware/05-rack-build-guide.md", "06":"../docs/software/06-software-delivery.md", "07":"../docs/hardware/07-open-questions.md",
  "11":"../docs/software/11-sandbox-bringup-plan.md", "deploy":"../delivery/intake/deploy.sh" };
const B_DIR = "/mnt/xfer/si-phase1-2026.11.20";
const NODES = ["svc01","svc02","svc03","gpu01"];

/* Three of these happen on each run, at the step that would hit them. */
const FAULT_POOL = ["sig","noroute","headers","checksum","imgpull","emptykey"];

/* Step fields: ph (phase), type, title, ref [doc, section], q (question), show (console text shown with the question),
   opts [[text, correct, why]], out (console output when answered right), fx (state change), fault (only on runs with that fault),
   skipIf (fault that replaces this step). Order steps: items [[text, fx, out]], bad [[text, why]]. */
const STEPS = [
 {ph:0, type:"intro", title:"Briefing"},

 {ph:0, type:"choice", title:"The transfer drive arrives", ref:["06","§4"],
  q:"The bundle came through the approved media process and is mounted on svc01 at <code>"+B_DIR+"</code>. What do you run first?",
  opts:[["<code>svc01# "+B_DIR+"/intake/verify.sh "+B_DIR+"</code>", true, "verify.sh checks the signature, every checksum, and the model files before anything is installed."],
        ["<code>svc01# "+B_DIR+"/intake/deploy.sh server-init</code>", false, "Nothing is installed until verify.sh prints PASS. A damaged or altered bundle has to be caught before it touches a node."],
        ["<code>svc01# ALLOW_UNSIGNED=1 "+B_DIR+"/intake/verify.sh "+B_DIR+"</code>", false, "ALLOW_UNSIGNED is only for throw-away tests on the build side. In the lab an unsigned bundle is refused."],
        ["Read MANIFEST.txt; if the versions look right, start installing", false, "MANIFEST.txt says what should be inside. Only verify.sh proves the files are what was sealed."]],
  out: () => S.faults.includes("sig")
    ? {h:"svc01", c:"intake/verify.sh "+B_DIR, o:["checking SHA256SUMS signature with the lab's public key","!FAIL: SHA256SUMS.sig does not verify (cosign: invalid signature)"]}
    : {h:"svc01", c:"intake/verify.sh "+B_DIR, o:["checking SHA256SUMS signature with the lab's public key ... ok","checking 1,214 files against SHA256SUMS ... ok","no files outside SHA256SUMS ... ok","model weights: safetensors only; whisper model.bin has the CTranslate2 header ... ok","+PASS"]},
  fx: () => { if (!S.faults.includes("sig")) S.k.verified = 1; }},

 {ph:0, type:"choice", fault:"sig", title:"Fault: the signature check fails", ref:["06","§4"],
  show:"verify.sh: FAIL: SHA256SUMS.sig does not verify (cosign: invalid signature)\nAll 1,214 checksums match SHA256SUMS.",
  q:"Every checksum matches, but the signature doesn't. What now?",
  opts:[["Stop. Install nothing. Report it to the build side and the ISSM, and wait for a re-sealed bundle on new media", true, "The checksums only prove the files match SHA256SUMS. If the signature fails, SHA256SUMS itself may have been changed, so nothing in the bundle can be trusted. In the sim, the re-sealed bundle arrives and passes."],
        ["Run it again with ALLOW_UNSIGNED=1, since all the checksums match", false, "Anyone who changes a file can also rewrite SHA256SUMS to match. The signature is the only proof the list came from the build side."],
        ["Regenerate SHA256SUMS on svc01 and run verify.sh again", false, "That makes the bundle agree with itself and proves nothing about where it came from."],
        ["Install now and check the signature after the go-live", false, "An unverified bundle never gets installed in the lab."]],
  out:{h:"svc01", c:"intake/verify.sh "+B_DIR+"   # re-sealed bundle", o:["checking SHA256SUMS signature with the lab's public key ... ok","checking 1,214 files against SHA256SUMS ... ok","+PASS"]},
  fx: () => { S.k.verified = 1; }},

 {ph:0, type:"multi", title:"What a PASS means", ref:["06","§1"],
  q:"Tick everything verify.sh has proved when it prints PASS.",
  opts:[["SHA256SUMS is signed by the build side's key (the public key agreed with the ISSM)", true],
        ["Every file matches its checksum, and no extra files were added", true],
        ["No pickle-style model files, except Whisper's model.bin with the CTranslate2 header", true],
        ["Every image is free of high and critical vulnerabilities", false, "verify.sh doesn't scan. The build side scanned every image before sealing; the reports are in scanner/reports/SUMMARY.txt. Findings are reviewed, not required to be zero."],
        ["The vulnerability database was updated to today", false, "Nothing in the lab reaches the internet. The bundle carries the database from the pull date."]]},

 {ph:1, type:"choice", title:"Start the cluster", ref:["06","§4"],
  q:"Which node starts the cluster, and with what?",
  opts:[["<code>svc01# ./intake/deploy.sh server-init</code>", true, "svc01 is the first control-plane server. It prints the join token for the other three nodes."],
        ["<code>gpu01# ./intake/deploy.sh server-init</code>", false, "gpu01 is a worker (agent). The three service nodes run the control plane."],
        ["<code>svc01# ./intake/deploy.sh server-join svc01</code>", false, "A node can't join a cluster that doesn't exist yet. The first server runs server-init."]],
  out: () => S.faults.includes("noroute")
    ? {h:"svc01", c:"./intake/deploy.sh server-init", o:["installing RKE2 from the bundle (no download)","starting rke2-server ...","!rke2-server: level=fatal msg=\"no default routes found in \\\"/proc/net/route\\\" or \\\"/proc/net/ipv6_route\\\"\""]}
    : {h:"svc01", c:"./intake/deploy.sh server-init", o:["installing RKE2 from the bundle (no download)","starting rke2-server ... ok","node svc01 Ready","join token (shown once): K10e4…::server:8c1d…"]},
  fx: () => { if (!S.faults.includes("noroute")) S.k.rke2.svc01 = "server"; }},

 {ph:1, type:"choice", fault:"noroute", title:"Fault: RKE2 won't start", ref:["11","§2"],
  show:"rke2-server: level=fatal msg=\"no default routes found in \"/proc/net/route\" or \"/proc/net/ipv6_route\"\"",
  q:"The lab subnet has no gateway configured on svc01, because nothing is meant to leave it. What fixes this?",
  opts:[["Get the subnet's gateway address from the lab network team, add it as the default route on every node, then run server-init again", true, "RKE2 picks its node address from the default route. The route has to exist even if no traffic ever uses it. The sandbox VM needs the same dummy route."],
        ["Turn off the firewall and run server-init again", false, "The firewall isn't involved. RKE2 stops before it opens a port because it can't pick a node address."],
        ["Ask for internet access for the install", false, "The install never needs the internet. It only needs a default route to exist."],
        ["Reinstall the OS on svc01", false, "The OS is fine. Only the route is missing."]],
  out:{h:"svc01", c:"nmcli con mod eno1 ipv4.gateway 10.20.30.1 && nmcli con up eno1 && ./intake/deploy.sh server-init", o:["starting rke2-server ... ok","node svc01 Ready","join token (shown once): K10e4…::server:8c1d…"]},
  fx: () => { S.k.rke2.svc01 = "server"; }},

 {ph:1, type:"choice", title:"The join token", ref:["06","§4"],
  q:"svc01 printed the join token. How does it get to svc02, svc03, and gpu01?",
  opts:[["Run the join on each node and paste the token at the hidden prompt (or point RKE2_TOKEN_FILE at a root-only file). deploy.sh stores it with mode 600.", true, "The token lets a machine join the cluster as a server. It never goes on a command line, into a file in the bundle, or into email."],
        ["<code>./intake/deploy.sh server-join 10.20.30.11 --token K10e4…</code>", false, "A token on the command line lands in shell history and is visible in the process list. Use the prompt or RKE2_TOKEN_FILE."],
        ["Save it in the bundle's intake/ folder so the other nodes can read it", false, "The bundle is kept and moved around. A secret doesn't go in it."],
        ["Email it to yourself to copy from the other consoles", false, "Lab email isn't a channel for cluster secrets, and the token would outlive the install."]]},

 {ph:1, type:"order", title:"Join the other nodes", ref:["06","§4"],
  lead:"Put the joins in order. svc01's address is 10.20.30.11.",
  items:[["<code>svc02# ./intake/deploy.sh server-join 10.20.30.11</code>", "j2"],
         ["<code>svc03# ./intake/deploy.sh server-join 10.20.30.11</code>", "j3"],
         ["<code>gpu01# ./intake/deploy.sh agent-join 10.20.30.11</code>", "jg"],
         ["<code>svc01# kubectl get nodes</code>: four nodes Ready", "nodes"]],
  bad:[["<code>gpu01# ./intake/deploy.sh server-join 10.20.30.11</code>", "gpu01 is a worker. It joins with agent-join. Three servers (svc01–svc03) keep the cluster's database in quorum; a fourth on the GPU node adds nothing and puts the control plane on the busiest machine."]]},

 {ph:2, type:"choice", fault:"headers", title:"Fault: the driver won't build", ref:["06","§4"],
  show:"gpu01# ./intake/deploy.sh driver\nERROR: install gcc, make, and kernel headers for 5.14.0-503.15.1.el9_5.x86_64 from the OS mirror first",
  q:"What do you do?",
  opts:[["Install gcc, make, and kernel-devel for exactly 5.14.0-503.15.1 from the lab's own OS mirror, then run <code>driver</code> again", true, "The driver is built for the running kernel. The bundle doesn't carry OS packages; the lab mirror does (doc 06, end of §4)."],
        ["Skip it. The GPU Operator installs the driver.", false, "Our GPU Operator values turn its driver container off. The driver goes on the host."],
        ["Download the headers on a laptop and carry them in on a USB stick", false, "Anything entering the lab goes through the approved media process. The lab mirror already has them."],
        ["Install the newest kernel-devel from the mirror", false, "It has to match the running kernel exactly (uname -r), or the module won't load."]],
  fx: () => {}},

 {ph:2, type:"order", title:"Prepare gpu01", ref:["06","§4"],
  lead:"gpu01 has joined. Get it ready to serve.",
  items:[["<code>gpu01# ./intake/deploy.sh driver</code> (NVIDIA open kernel modules, which Blackwell needs)", "driver"],
         ["Check <code>nvidia-smi</code> lists 4 × RTX PRO 6000", "smi"],
         ["<code>gpu01# ./intake/deploy.sh models</code>: copies the models to local NVMe and checks every SHA256SUMS", "models"]],
  bad:[["<code>svc01# ./intake/deploy.sh models</code>", "Models are read from local NVMe on the node that runs them: gpu01. The embedding model runs there too, on CPU."],
       ["Point the model servers at the transfer drive instead of copying", "The drive is slow, gets unplugged, and leaves with the media process. The copy to /var/lib/models is what the pods read."]]},

 {ph:2, type:"choice", fault:"checksum", title:"Fault: a model fails its check", ref:["06","§4"],
  show:"gpu01# ./intake/deploy.sh models\nmodel-00011-of-00014.safetensors: FAILED\nERROR: model check failed: /var/lib/models/gpt-oss-120b/SHA256SUMS",
  out:{h:"gpu01", c:"./intake/deploy.sh models   # second copy", o:["+models in /var/lib/models (68G), checksums OK"]},
  q:"verify.sh passed on the drive an hour ago. What now?",
  opts:[["Run <code>models</code> again so rsync re-copies the bad file. If it fails again, run verify.sh on the drive; if that fails, the drive is damaged and a new copy is needed.", true, "The copy to NVMe went wrong, or the drive is failing. Either way the model is never started from a file that fails its checksum. In the sim, the second copy passes."],
        ["Delete SHA256SUMS in that folder so the step finishes", false, "A corrupted weight file can make the model give wrong answers without crashing. The check is the protection."],

/* ---------- state ---------- */
let S;
function fresh(keep){
  const pool = FAULT_POOL.slice(), faults = keep ? keep.slice() : [];
  while (faults.length < 3) faults.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return { step:0, started:false, t0:0, mistakes:[], fb:null, ss:{}, faults, term:[],
    steps: STEPS.filter(st => !st.fault || faults.includes(st.fault)),
    k:{ rke2:{}, verified:0, driver:0, models:0, platform:0, apps:0, vllmReady:0, admin:0, gwkey:0, docs:0 } };
}
S = fresh();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const cur = () => S.steps[S.step];
function ss(){ return S.ss[S.step] || (S.ss[S.step] = {}); }
function refLink(r){ if(!r) return ""; const lbl = r[0]==="deploy" ? "deploy.sh "+r[1] : "doc "+r[0]+" "+(r[1]||"");
  return `<a class="ref" href="${DOC[r[0]]}">${esc(lbl)}</a>`; }
function miss(text){ S.mistakes.push({step:cur().title, text}); S.fb = {kind:"bad", text}; render(); }
function good(text){ S.fb = text ? {kind:"ok", text} : null; }
function next(){ S.fb = null; S.step++; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function fbHTML(){ if(!S.fb) return ""; const t = S.fb.kind==="bad" ? "Not right" : "Correct";
  return `<div class="feedback ${S.fb.kind}" role="status"><b class="t">${t}</b>${S.fb.text}</div>`; }
function say(out){ if (!out) return; S.term.push({h:out.h, c:out.c, o:out.o||[]}); }
function finish(st){ if (st.fx) st.fx(); say(typeof st.out === "function" ? st.out() : st.out); }

/* ---------- render ---------- */
function render(){
  const st = cur();
  $("#st-step").textContent = Math.min(S.step+1, S.steps.length-1) + "/" + (S.steps.length-1);
  $("#st-miss").textContent = S.mistakes.length;
  renderJump();
  $("#rail").innerHTML = PHASES.map((p,i)=>`<button class="${i<st.ph?"done":i===st.ph?"now":""}" data-ph="${i}" title="Jump to ${p}"><span>${i+1}</span>${p}</button>`).join("");
  renderScene();
  const el = $("#task");
  const head = st.type==="intro"||st.type==="end" ? "" :
    `<div class="eyebrow"><span>Phase ${st.ph+1} · ${PHASES[st.ph]}</span>${st.fault?`<span class="fault">Fault on this run</span>`:""}${refLink(st.ref)}</div><h2>${esc(st.title)}</h2>`;
  el.innerHTML = head + (st.show ? `<pre>${esc(st.show)}</pre>` : "") + (R[st.type](st) || "");
  if (B[st.type]) B[st.type](st, el);
}
const R = {}, B = {};

R.intro = () => `<div class="eyebrow"><span>Briefing</span></div><h2>Bring up the SI service on rack 1</h2>
  <p>Rack 1 is signed off: the OS is on all four nodes, hw-check and net-test passed, and the cables match the schedule.
  The release bundle has come through the approved media process on the transfer drive. There is no internet, now or later.
  Every step follows <a href="${DOC["06"]}">doc 06</a>. Wrong choices count as mistakes and tell you why.</p>
  <div class="intro-grid">
    <div><b>svc01–svc03</b>Kubernetes control plane (RKE2), PostgreSQL, the LiteLLM gateway, and the Open WebUI chat page.</div>
    <div><b>gpu01</b>4 × RTX PRO 6000. Three copies of gpt-oss-120b and one Whisper. The embedding model for document upload runs on its CPUs.</div>
    <div><b>Names</b>chat.lab.example for the chat page, api.lab.example for Jupyter, VS Code, MATLAB, and scripts.</div>
    <div><b>Faults</b>Three things go wrong on each run, as they could on the day. Run it again for different ones.</div>
  </div>
  <div class="row"><button class="primary" id="go">Start bring-up</button></div>`;
B.intro = () => { $("#go").onclick = () => { S.started = true; S.t0 = Date.now(); next(); }; };

R.choice = st => { const s = ss();
  if (!s.order) s.order = shuffle(st.opts.map((_,i)=>i));
  return `<p>${st.q}</p><div class="opts">${s.order.map((i,k)=>{ const o = st.opts[i];
    return `<button class="opt${s.done&&o[1]?" right":""}" data-i="${i}" ${s.done||(s.tried||[]).includes(i)?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${o[0]}</span></button>`; }).join("")}</div>
    ${fbHTML()}${s.done?`<div class="row"><button class="primary" id="nx">Next</button></div>`:""}`; };
B.choice = (st, el) => {
  el.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => { const s = ss(), o = st.opts[+b.dataset.i];
    if (o[1]) { s.done = true; finish(st); good(o[2]); render(); } else { (s.tried ||= []).push(+b.dataset.i); miss(o[2]); } });
  const nx = el.querySelector("#nx"); if (nx) nx.onclick = next;
};

R.multi = st => { const s = ss(); s.sel ||= {}; if (!s.order) s.order = shuffle(st.opts.map((_,i)=>i));
  return `<p>${st.q}</p><div class="opts">${s.order.map(i=>`<button class="opt chk${s.done&&st.opts[i][1]?" right":""}" data-i="${i}" aria-pressed="${!!s.sel[i]}" ${s.done?"disabled":""}><span class="k">${s.sel[i]?"■":"□"}</span><span>${st.opts[i][0]}</span></button>`).join("")}</div>
  ${fbHTML()}<div class="row">${s.done?`<button class="primary" id="nx">Next</button>`:`<button class="primary" id="chk">Check</button>`}</div>`; };
B.multi = (st, el) => {
  el.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => { const s = ss(); s.sel[b.dataset.i] = !s.sel[b.dataset.i]; S.fb = null; render(); });
  const c = el.querySelector("#chk"); if (c) c.onclick = () => { const s = ss();
    const wrong = st.opts.map((o,i)=>[o,i]).filter(([o,i]) => !!s.sel[i] !== o[1]);
    if (!wrong.length) { s.done = true; finish(st); good("All set."); render(); return; }
    miss(wrong.map(([o]) => o[1] ? `Missing: <b>${o[0]}</b>.` : `<b>${o[0]}</b>: ${o[2]}`).join("<br>")); };
  const nx = el.querySelector("#nx"); if (nx) nx.onclick = next;
};

      : {h:"gpu01", c:"./intake/deploy.sh models", o:["models in /var/lib/models (68G), checksums OK"]}); },
  admin(){ S.k.admin = 1; say({h:"browser", c:"https://chat.lab.example/  (create admin account)", o:["admin account created"]}); },
  gwkey(){ S.k.gwkey = 1; say({h:"svc01", c:"./intake/deploy.sh gateway-key", o:["statefulset.apps/open-webui restarted","chat page now uses its own gateway key"]}); },
  docs(){ S.k.docs = 1; say({h:"browser", c:"Admin Panel > Settings > Documents", o:["Embedding engine: OpenAI   Model: arctic-embed",
    S.faults.includes("emptykey") ? "!API key: (empty)" : "+API key: sk-…f3a9 (set)"]}); }
};
R.order = st => { const s = ss(); s.done ||= [];
  if (!s.pool) s.pool = shuffle([...st.items.map((_,i)=>"g"+i), ...(st.bad||[]).map((_,i)=>"b"+i)]);
  const left = s.pool.filter(k => !s.done.includes(k) && !(s.badHit||[]).includes(k));
  const fin = s.done.length === st.items.length;
  return `${st.lead?`<p class="lead">${st.lead}</p>`:""}
    <ol class="done-list">${s.done.map((k,n)=>`<li><span>${n+1}</span><span style="font:inherit;color:inherit">${st.items[+k.slice(1)][0]}</span></li>`).join("")}</ol>
    ${fin ? "" : `<p class="subh">${s.done.length ? "Then" : "First"}</p><div class="opts">${left.map(k=>{ const it = k[0]==="g" ? st.items[+k.slice(1)] : st.bad[+k.slice(1)];
      return `<button class="opt" data-k="${k}"><span class="k">›</span><span>${it[0]}</span></button>`; }).join("")}</div>`}
    ${fbHTML()}${fin?`<div class="row"><button class="primary" id="nx">Next</button></div>`:""}`; };
B.order = (st, el) => {
  el.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => { const s = ss(), k = b.dataset.k;
    if (k[0]==="b") { (s.badHit ||= []).push(k); miss(st.bad[+k.slice(1)][1]); return; }
    const want = "g" + s.done.length;
    if (k !== want) { miss(`Not yet. <b>${st.items[+k.slice(1)][0]}</b> comes later. Something else has to happen first.`); return; }
    s.done.push(k); const fx = st.items[+k.slice(1)][1]; if (fx) FX[fx]();
    good(s.done.length===st.items.length ? "Sequence complete." : null); render(); });
  const nx = el.querySelector("#nx"); if (nx) nx.onclick = next;
};

R.end = () => { const n = S.mistakes.length, t = elapsed();
  const grade = n===0 ? "Ready for bring-up" : n<=5 ? "Ready, after a review" : "Run it again";
  const names = {sig:"signature check failed", noroute:"no default route", headers:"missing kernel headers", checksum:"model checksum failed", imgpull:"image missing from the package", emptykey:"empty key for document upload"};
  return `<div class="eyebrow"><span>Result</span></div><h2>SI service handed over</h2>
    <p class="grade">${grade}</p>${S.from ? `<p class="lead">You jumped to <b>${esc(S.steps[S.from].title)}</b>, so only the steps from there on are graded.</p>` : ""}<p class="mono">${n} mistake${n===1?"":"s"} · ${t} · faults this run: ${S.faults.map(f=>names[f]).join(", ")}</p>
    ${n ? `<p class="subh">What went wrong</p><ol class="misslog">${S.mistakes.map(m=>`<li><b>${esc(m.step)}:</b> ${m.text}</li>`).join("")}</ol>` : "<p>No mistakes. Bring doc 06 on the day anyway.</p>"}
    <p class="lead">Still open before the real bring-up: the signing key and how the lab gets its public key (ISSM), the lab CA certificate for chat and api, the subnet gateway for the default route, and the Continue agent-mode decision (doc 11, section 7).</p>
    <div class="row"><button class="primary" id="again">Run it again</button><a href="rack1-install-sim.html">Back to the Rack 1 Install Sim</a></div>`; };
B.end = () => { $("#again").onclick = () => { S = fresh(); render(); }; };

/* ---------- scene ---------- */
function podsFor(n){
  const k = S.k, P = [];
  if (!k.rke2[n]) return P;
  if (k.platform && n==="svc01") P.push(["zarf-docker-registry","Running"],["local-path-provisioner","Running"]);
  if (!k.apps) return P;
  if (n.startsWith("svc")) P.push(["si-postgres-"+n.slice(-1),"Running"]);
  if (n==="svc01" || n==="svc02") P.push(["litellm","Running"]);
  if (n==="svc02") P.push(["cnpg-controller","Running"]);
  if (n==="svc03") P.push(["open-webui-0","Running"],["tika (OCR)","Running"]);
  if (n==="gpu01") {
    P.push(["nvidia-device-plugin","Running"],["dcgm-exporter","Running"]);
    if (S.faults.includes("imgpull") && !k.imgFixed) P.push(["whisper","ImagePullBackOff"]);
    P.push(["embed (CPU)","Running"]);
  }
  return P;
}
function gpuBoxes(){
  const k = S.k;
  return [0,1,2,3].map(i => {
    if (!k.driver) return `<div class="g none"><b>GPU ${i}</b>no driver</div>`;
    if (!k.apps)   return `<div class="g"><b>GPU ${i}</b>idle</div>`;
    if (i < 3) return `<div class="g ${k.vllmReady?"run":"load"}"><b>GPU ${i}</b>gpt-oss-120b<br>${k.vllmReady?"Ready":"loading"}</div>`;
    const pull = S.faults.includes("imgpull") && !k.imgFixed;
    return `<div class="g ${pull?"":"run"}"${pull?' style="border-color:var(--bad)"':""}><b>GPU 3</b>whisper<br>${pull?"no image":"Ready"}</div>`;
  }).join("");
}
function renderScene(){
  const k = S.k;
  $("#scene-sub").textContent = k.verified ? "bundle verified" : "bundle not verified";
  $("#nodes").innerHTML = NODES.map(n => {
    const r = k.rke2[n], gpu = n==="gpu01";
    const pill = r ? `<span class="pill ok">${r==="agent"?"agent":"server"} · Ready</span>` : `<span class="pill">OS only</span>`;
    const labels = !k.platform || !r ? "" : `<div class="labels"><span>${gpu?"node-role.si/models":"node-role.si/service"}</span>${gpu&&k.apps?"<span>nvidia.com/gpu.present</span>":""}</div>`;
    const pods = podsFor(n);
    const role = gpu ? "4 × RTX PRO 6000 · worker" : "control plane · services";
    return `<div class="node ${gpu?"gpu":""}"><h3>${n}${pill}</h3><div class="role">${role}</div>${labels}
      ${gpu ? `<div class="gpus">${gpuBoxes()}</div>${k.models?'<div class="role">/var/lib/models: gpt-oss-120b, faster-whisper, arctic-embed</div>':""}` : ""}
      ${pods.length ? `<ul class="pods">${pods.map(([p,s])=>`<li class="${s==="Running"?"":"bad"}"><i></i><b>${esc(p)}</b><em>${esc(s)}</em></li>`).join("")}</ul>` : ""}</div>`;
  }).join("");
  const t = $("#term");
  t.innerHTML = S.term.length ? S.term.map(e => `<span class="p">${esc(e.h)}#</span> ${esc(e.c)}\n` +
      e.o.map(l => l[0]==="!" ? `<span class="bad">${esc(l.slice(1))}</span>` : l[0]==="+" ? `<span class="ok">${esc(l.slice(1))}</span>` : `<span class="d">${esc(l)}</span>`).join("\n")).join("\n\n")
    : `<span class="d">Console. Commands you choose run here.</span>`;
  t.scrollTop = t.scrollHeight;
}

function elapsed(){ if (!S.started) return "0:00"; const s = Math.floor((Date.now()-S.t0)/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
/* ---------- jump ---------- */
/* Jumping replays every earlier step as if answered right (state changes and console output),
   keeping this run's three faults. */
function solveStep(st){
  if (st.type==="intro") { S.started = true; S.t0 = Date.now(); }
  else if (st.type==="choice" || st.type==="multi") finish(st);
  else if (st.type==="order") st.items.forEach(it => { if (it[1]) FX[it[1]](); });
}
function jumpTo(i){
  if (i === S.step) return;
  if (S.started && cur().type !== "end" && !confirm(`Jump to "${S.steps[i].title}"? This run starts over from there.`)) { render(); return; }
  S = fresh(S.faults);
  for (let k=0; k<i; k++) solveStep(S.steps[k]);
  S.step = i; S.from = i;
  history.replaceState(null, "", "#step-" + (i+1));
  render(); window.scrollTo({top:0, behavior:"smooth"});
}
function renderJump(){
  $("#jump").innerHTML = PHASES.map((p,ph) => `<optgroup label="${ph+1} · ${p}">${S.steps.map((st,i) => st.ph===ph
    ? `<option value="${i}" ${i===S.step?"selected":""}>${i+1}. ${esc(st.title)}</option>` : "").join("")}</optgroup>`).join("");
}
$("#jump").onchange = e => jumpTo(+e.target.value);
$("#rail").onclick = e => { const b = e.target.closest("[data-ph]"); if (b) jumpTo(S.steps.findIndex(st => st.ph === +b.dataset.ph)); };

setInterval(() => { if (cur().type !== "end") $("#st-time").textContent = elapsed(); }, 1000);
render();
{ const m = /^#step-(\d+)$/.exec(location.hash), i = m ? +m[1]-1 : -1; if (i > 0 && i < S.steps.length) jumpTo(i); }
</script>
