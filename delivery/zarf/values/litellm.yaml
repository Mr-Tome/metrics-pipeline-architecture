# LiteLLM gateway. Every client (chat page, Jupyter, VS Code, MATLAB) goes through here,
# so sign-in keys, logging, and usage limits live in one place.
image:
  repository: ${LITELLM_REPO}
  tag: ${LITELLM_TAG}
masterkeySecretName: litellm-masterkey
envVars:
  # Use the price list inside the image; otherwise LiteLLM fetches it from GitHub at every start.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
db:
  useExisting: true
  deployStandalone: false
  endpoint: si-postgres-rw.si.svc
  database: litellm
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
  secret:
    name: si-postgres-app
    usernameKey: username
    passwordKey: password
proxy_config:
  model_list:
    - model_name: gpt-oss-120b
      litellm_params:
        model: hosted_vllm/gpt-oss-120b
        api_base: http://vllm.si.svc:8000/v1
    - model_name: whisper
      litellm_params:
        model: openai/Systran/faster-whisper-large-v3
        api_base: http://whisper.si.svc:8000/v1
      model_info:
        mode: audio_transcription
    - model_name: arctic-embed
      litellm_params:
        model: openai/arctic-embed
        api_base: http://embed.si.svc:8000/v1
      model_info:
        mode: embedding
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
  litellm_settings:
    telemetry: false
ingress:
  enabled: true
  # RKE2's Traefik. HTTPS only. Traefik has no limit on how long the gateway takes to answer and no body
  # size limit by default, so non-streaming calls (MATLAB webwrite) and long reasoning answers need no
  # annotations. Its only default limit is 60 s to receive the request itself.
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: "###ZARF_VAR_API_HOST###"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: si-tls
      hosts:
        - "###ZARF_VAR_API_HOST###"
