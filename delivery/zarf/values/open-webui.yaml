# Open WebUI chat page. Talks only to the LiteLLM gateway; bundled Ollama and pipelines are off.
image:
  repository: ${OPEN_WEBUI_REPO}
  tag: ${OPEN_WEBUI_TAG}
ollama:
  enabled: false
pipelines:
  enabled: false
# The chart adds a Redis for websockets by default. One chat-page replica doesn't need it, and Redis 7.4
# is under RSALv2/SSPLv1, not an open-source license.
websocket:
  enabled: false
openaiBaseApiUrl: http://litellm.si.svc:4000/v1
extraEnvVars:
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-gateway-key
        key: key
        optional: true
  - name: OFFLINE_MODE
    value: "true"
  - name: ENABLE_OLLAMA_API
    value: "false"
  - name: SCARF_NO_ANALYTICS
    value: "true"
  - name: DO_NOT_TRACK
    value: "true"
  - name: ANONYMIZED_TELEMETRY
    value: "false"
  # Speech-to-text goes to Whisper through the gateway (same URL and key as chat). Without this, the
  # chat page tries to download its own Whisper model, which fails offline.
  - name: AUDIO_STT_ENGINE
    value: openai
  - name: AUDIO_STT_MODEL
    value: whisper
  # Document upload. Embeddings come from doc-embed through the gateway (manifests/embed.yaml); the
  # openai engine also stops the chat page from trying to download its built-in embedding model.
  # Vectors are stored in the chat page's own volume (Chroma), next to its chat history.
  - name: RAG_EMBEDDING_ENGINE
    value: openai
  - name: RAG_EMBEDDING_MODEL
    value: doc-embed
  # granite-embedding needs no "query: " prefix on questions (the earlier arctic model did).
  # Default is 1 piece per request, which makes a large upload thousands of calls.
  - name: RAG_EMBEDDING_BATCH_SIZE
    value: "32"
  # The embedding model reads at most 512 tokens per piece, so pieces stay at 1,500 characters (about 400
  # tokens of English; other languages use more tokens per character). 12 pieces is about 5,000 tokens of
  # document per question, well inside the language model's 65k context.
  - name: CHUNK_SIZE
    value: "1500"
  - name: CHUNK_OVERLAP
    value: "150"
  - name: RAG_TOP_K
    value: "12"
  # Text extraction goes to Tika (manifests/tika.yaml), which also OCRs scanned PDF pages.
  - name: CONTENT_EXTRACTION_ENGINE
    value: tika
  - name: TIKA_SERVER_URL
    value: http://tika.si.svc:9998
  # Megabytes. The chat page enforces this itself; Traefik sets no body limit.
  - name: RAG_FILE_MAX_SIZE
    value: "50"
# The settings above are read on first start only; after that they live in the chat page database
# (Admin Panel, Settings).
persistence:
  enabled: true
  size: 20Gi
ingress:
  enabled: true
  # RKE2's Traefik. No response-time or body-size limit by default (see values/litellm.yaml).
  class: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: "###ZARF_VAR_CHAT_HOST###"
  tls: true
  existingSecret: si-tls
