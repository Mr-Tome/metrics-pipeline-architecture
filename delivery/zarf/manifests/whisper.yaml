# Speech-to-text (faster-whisper behind an OpenAI-compatible API). Uses the second GPU in the lab.
# On staging (one GPU) leave this component out, or it will wait for a free GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ai
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: whisper
          image: ${WHISPER_IMAGE}
          env:
            - name: HF_HUB_CACHE
              value: /models/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /var/lib/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: ai
spec:
  selector:
    app: whisper
  ports:
    - port: 8000
      targetPort: 8000
