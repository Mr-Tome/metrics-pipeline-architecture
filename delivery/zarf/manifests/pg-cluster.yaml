# One PostgreSQL cluster, three instances (one per service node) for failover.
# The "standard" image includes pgvector, used later for document search.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: si-postgres
  namespace: si
spec:
  instances: ###ZARF_VAR_PG_INSTANCES###
  imageName: ${POSTGRES_IMAGE}
  storage:
    size: 100Gi
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  affinity:
    nodeSelector:
      node-role.si/service: "true"
