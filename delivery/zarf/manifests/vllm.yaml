# vLLM serving the language model. Weights are read from local NVMe on the GPU node
# (/var/lib/models), copied there by intake/deploy.sh. Nothing is downloaded at runtime.
# One replica per GPU: 3 in the lab (the fourth GPU runs Whisper). Updates replace one replica at a
# time, so two keep serving, and a new version that never gets ready stops the rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  labels:
    app: vllm
spec:
  replicas: ###ZARF_VAR_VLLM_REPLICAS###
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          args:
            - --model=/models/gpt-oss-120b
            - --served-model-name=gpt-oss-120b
            - --tensor-parallel-size=1
            - --max-model-len=65536
            - --gpu-memory-utilization=0.90
            - --port=8000
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 90
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/lib/models
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
