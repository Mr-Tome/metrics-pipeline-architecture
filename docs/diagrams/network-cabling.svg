<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 810' width='1100' height='810' font-family='Helvetica, Arial, sans-serif'><title>Network cabling</title><rect width='1100' height='810' fill='#ffffff'/><text x='30' y='34' font-size='20' text-anchor='start' font-weight='bold' fill='#111'>Network cabling: lab</text><text x='30' y='56' font-size='12' text-anchor='start' font-weight='normal' fill='#444'>Our switch connects to the C9300-48S in the rack building. Users reach the AI service through their normal switches. The existing network does not change.</text><rect x='80' y='80' width='250' height='62' fill='#f3e5f5' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='100' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Analyst workstations</text><text x='205.0' y='117' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>Jupyter, VS Code, MATLAB, browser</text><rect x='80' y='180' width='250' height='62' fill='#e0e0e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='200' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Cisco C9300-48S</text><text x='205.0' y='217' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing, analysts' building</text><rect x='80' y='280' width='250' height='62' fill='#e0e0e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='300' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Cisco C9500X core</text><text x='205.0' y='317' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing</text><rect x='80' y='380' width='250' height='70' fill='#e0e0e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='400' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Cisco C9300-48S</text><text x='205.0' y='417' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing, rack building</text><text x='205.0' y='431' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>C9300-NM-8X: 8 x 10G SFP+</text><line x1='205' y1='142' x2='205' y2='180' stroke='#2e7d32' stroke-width='2'/><text x='215' y='166' font-size='10.5' text-anchor='start' font-weight='normal' fill='#2e7d32'>1G (existing)</text><line x1='195' y1='242' x2='195' y2='280' stroke='#ef6c00' stroke-width='3'/><line x1='215' y1='242' x2='215' y2='280' stroke='#ef6c00' stroke-width='3'/><text x='225' y='266' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>10G fiber (existing)</text><line x1='195' y1='342' x2='195' y2='380' stroke='#ef6c00' stroke-width='3'/><line x1='215' y1='342' x2='215' y2='380' stroke='#ef6c00' stroke-width='3'/><text x='225' y='366' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>10G fiber (existing)</text><rect x='540' y='380' width='500' height='70' fill='#ffe0b2' stroke='#333' stroke-width='1.5' rx='6'/><text x='790.0' y='400' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>sw01 Lab switch, Dell S5248F-ON</text><text x='790.0' y='417' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>48 x 25G SFP28, 4 x 100G QSFP28</text><text x='790.0' y='431' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>new, in lab rack 1</text><path d='M330 405 L540 405' fill='none' stroke='#ef6c00' stroke-width='4'/><path d='M330 425 L540 425' fill='none' stroke='#ef6c00' stroke-width='4'/><text x='435' y='397' font-size='11' text-anchor='middle' font-weight='bold' fill='#ef6c00'>2 x 10G fiber (LACP), plan</text><text x='435' y='442' font-size='10' text-anchor='middle' font-weight='normal' fill='#ef6c00'>Cisco SFP-10G-SR-S to Dell 407-BBOU</text><text x='435' y='470' font-size='10' text-anchor='middle' font-weight='normal' fill='#444'>Racks have no patch panels:</text><text x='435' y='484' font-size='10' text-anchor='middle' font-weight='normal' fill='#444'>one LC-LC OM4 cord per link, length per path</text><path d='M330 300 C 470 300, 620 320, 660 380' fill='none' stroke='#ef6c00' stroke-width='2' stroke-dasharray='6 4'/><text x='480' y='298' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>Only if the lab allows: 2 x 100G to the core</text><rect x='545' y='560' width='92' height='64' fill='#c8e6c9' stroke='#333' stroke-width='1.5' rx='6'/><text x='591.0' y='580' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>gpu01</text><text x='591.0' y='597' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='591.0' y='611' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/1-2</text><line x1='583' y1='450' x2='583' y2='560' stroke='#212121' stroke-width='2'/><line x1='599' y1='450' x2='599' y2='560' stroke='#212121' stroke-width='2'/><rect x='647' y='560' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='693.0' y='580' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc01</text><text x='693.0' y='597' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='693.0' y='611' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/3-4</text><line x1='685' y1='450' x2='685' y2='560' stroke='#212121' stroke-width='2'/><line x1='701' y1='450' x2='701' y2='560' stroke='#212121' stroke-width='2'/><rect x='749' y='560' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='795.0' y='580' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc02</text><text x='795.0' y='597' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='795.0' y='611' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/5-6</text><line x1='787' y1='450' x2='787' y2='560' stroke='#212121' stroke-width='2'/><line x1='803' y1='450' x2='803' y2='560' stroke='#212121' stroke-width='2'/><rect x='851' y='560' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='897.0' y='580' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc03</text><text x='897.0' y='597' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='897.0' y='611' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/7-8</text><line x1='889' y1='450' x2='889' y2='560' stroke='#212121' stroke-width='2'/><line x1='905' y1='450' x2='905' y2='560' stroke='#212121' stroke-width='2'/><rect x='953' y='560' width='92' height='64' fill='#eeeeee' stroke='#333' stroke-width='1.5' rx='6'/><text x='999.0' y='580' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>gpu02</text><text x='999.0' y='597' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='999.0' y='611' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>future, 1/1/9-10</text><line x1='991' y1='450' x2='991' y2='560' stroke='#212121' stroke-width='2'/><line x1='1007' y1='450' x2='1007' y2='560' stroke='#212121' stroke-width='2'/><text x='530' y='512' font-size='11' text-anchor='end' font-weight='normal' fill='#212121'>25G SFP28 passive DAC, 3 m</text><text x='530' y='527' font-size='11' text-anchor='end' font-weight='normal' fill='#212121'>two per node, bonded (LACP)</text><rect x='80' y='660' width='250' height='62' fill='#fff9c4' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='680' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>oob01 1G management switch</text><text x='205.0' y='697' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>BMC / IPMI ports only</text><text x='205.0' y='711' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>separate VLAN, no user access</text><path d='M330 690 C 360 690, 565 680, 565 624' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 690 C 360 690, 667 680, 667 624' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 690 C 360 690, 769 680, 769 624' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 690 C 360 690, 871 680, 871 624' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><text x='340' y='740' font-size='11' text-anchor='start' font-weight='normal' fill='#6a1b9a'>Cat6 from each server BMC port to oob01. oob01 uplink goes where the lab network team says (their management network).</text><text x='80' y='780' font-size='13' text-anchor='start' font-weight='bold' fill='#111'>Legend</text><line x1='160' y1='776' x2='200' y2='776' stroke='#ef6c00' stroke-width='3'/><text x='206' y='780' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Fiber (optics + patch cord)</text><line x1='380' y1='776' x2='420' y2='776' stroke='#212121' stroke-width='3'/><text x='426' y='780' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Direct-attach copper (DAC)</text><line x1='600' y1='776' x2='640' y2='776' stroke='#2e7d32' stroke-width='3'/><text x='646' y='780' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Existing user links</text><line x1='820' y1='776' x2='860' y2='776' stroke='#6a1b9a' stroke-width='3' stroke-dasharray='3 3'/><text x='866' y='780' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Management (BMC) Cat6</text></svg>
