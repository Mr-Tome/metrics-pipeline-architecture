<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 780' width='1100' height='780' font-family='Helvetica, Arial, sans-serif'><title>Network cabling</title><rect width='1100' height='780' fill='#ffffff'/><text x='30' y='34' font-size='20' text-anchor='start' font-weight='bold' fill='#111'>Network cabling: lab</text><text x='30' y='56' font-size='12' text-anchor='start' font-weight='normal' fill='#444'>The lab switch hangs off the existing core. Users reach the AI service through their normal access switches. Nothing about the existing user network changes.</text><rect x='80' y='90' width='250' height='70' fill='#f3e5f5' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='110' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Analyst workstations</text><text x='205.0' y='127' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>Jupyter, VS Code, MATLAB, browser</text><text x='205.0' y='141' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing desks</text><rect x='80' y='210' width='250' height='70' fill='#e0e0e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='230' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Access: Cisco C9300-48? x2</text><text x='205.0' y='247' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing; model to confirm</text><text x='205.0' y='261' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>10G fiber uplinks to core</text><rect x='80' y='340' width='250' height='70' fill='#e0e0e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='360' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Core: Cisco C9500X</text><text x='205.0' y='377' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing; 100G QSFP28 ports</text><text x='205.0' y='391' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>need 2 free ports (preferred)</text><line x1='205' y1='160' x2='205' y2='210' stroke='#2e7d32' stroke-width='2'/><text x='215' y='190' font-size='10.5' text-anchor='start' font-weight='normal' fill='#2e7d32'>1G copper or fiber (existing)</text><line x1='195' y1='280' x2='195' y2='340' stroke='#ef6c00' stroke-width='3'/><line x1='215' y1='280' x2='215' y2='340' stroke='#ef6c00' stroke-width='3'/><text x='225' y='315' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>2 x 10G fiber (existing)</text><rect x='540' y='340' width='500' height='70' fill='#ffe0b2' stroke='#333' stroke-width='1.5' rx='6'/><text x='790.0' y='360' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>sw01 Lab switch, Dell S5248F-ON</text><text x='790.0' y='377' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>48 x 25G SFP28, 4 x 100G QSFP28</text><text x='790.0' y='391' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>new, in the lab rack</text><path d='M330 365 L540 365' fill='none' stroke='#ef6c00' stroke-width='4'/><path d='M330 385 L540 385' fill='none' stroke='#ef6c00' stroke-width='4'/><text x='435' y='357' font-size='11' text-anchor='middle' font-weight='bold' fill='#ef6c00'>Option A: 2 x 100G fiber (LACP)</text><text x='435' y='402' font-size='10' text-anchor='middle' font-weight='normal' fill='#ef6c00'>C9500X 100G port to sw01 QSFP28</text><path d='M330 240 C 450 240, 600 260, 640 340' fill='none' stroke='#ef6c00' stroke-width='2' stroke-dasharray='6 4'/><text x='500' y='245' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>Option B (fallback): 2 x 10G from C9300 NM-8X</text><text x='500' y='259' font-size='10.5' text-anchor='start' font-weight='normal' fill='#ef6c00'>to sw01 SFP28 ports running at 10G</text><rect x='545' y='520' width='92' height='64' fill='#c8e6c9' stroke='#333' stroke-width='1.5' rx='6'/><text x='591.0' y='540' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>gpu01</text><text x='591.0' y='557' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='591.0' y='571' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/1-2</text><line x1='583' y1='410' x2='583' y2='520' stroke='#212121' stroke-width='2'/><line x1='599' y1='410' x2='599' y2='520' stroke='#212121' stroke-width='2'/><rect x='647' y='520' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='693.0' y='540' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc01</text><text x='693.0' y='557' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='693.0' y='571' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/3-4</text><line x1='685' y1='410' x2='685' y2='520' stroke='#212121' stroke-width='2'/><line x1='701' y1='410' x2='701' y2='520' stroke='#212121' stroke-width='2'/><rect x='749' y='520' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='795.0' y='540' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc02</text><text x='795.0' y='557' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='795.0' y='571' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/5-6</text><line x1='787' y1='410' x2='787' y2='520' stroke='#212121' stroke-width='2'/><line x1='803' y1='410' x2='803' y2='520' stroke='#212121' stroke-width='2'/><rect x='851' y='520' width='92' height='64' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='897.0' y='540' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc03</text><text x='897.0' y='557' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='897.0' y='571' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1/1/7-8</text><line x1='889' y1='410' x2='889' y2='520' stroke='#212121' stroke-width='2'/><line x1='905' y1='410' x2='905' y2='520' stroke='#212121' stroke-width='2'/><rect x='953' y='520' width='92' height='64' fill='#eeeeee' stroke='#333' stroke-width='1.5' rx='6'/><text x='999.0' y='540' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>gpu02</text><text x='999.0' y='557' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G</text><text x='999.0' y='571' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>future, 1/1/9-10</text><line x1='991' y1='410' x2='991' y2='520' stroke='#212121' stroke-width='2'/><line x1='1007' y1='410' x2='1007' y2='520' stroke='#212121' stroke-width='2'/><text x='530' y='462' font-size='11' text-anchor='end' font-weight='normal' fill='#212121'>25G SFP28 passive DAC, 3 m</text><text x='530' y='477' font-size='11' text-anchor='end' font-weight='normal' fill='#212121'>two per node, bonded (LACP)</text><rect x='80' y='620' width='250' height='62' fill='#fff9c4' stroke='#333' stroke-width='1.5' rx='6'/><text x='205.0' y='640' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>oob01 1G management switch</text><text x='205.0' y='657' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>BMC / IPMI ports only</text><text x='205.0' y='671' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>separate VLAN, no user access</text><path d='M330 650 C 360 650, 565 640, 565 584' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 650 C 360 650, 667 640, 667 584' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 650 C 360 650, 769 640, 769 584' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><path d='M330 650 C 360 650, 871 640, 871 584' fill='none' stroke='#6a1b9a' stroke-width='1.5' stroke-dasharray='3 3'/><text x='340' y='700' font-size='11' text-anchor='start' font-weight='normal' fill='#6a1b9a'>Cat6 from each server BMC port to oob01. oob01 uplink goes where the lab network team says (their management network).</text><text x='80' y='740' font-size='13' text-anchor='start' font-weight='bold' fill='#111'>Legend</text><line x1='160' y1='736' x2='200' y2='736' stroke='#ef6c00' stroke-width='3'/><text x='206' y='740' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Fiber (optics + patch cord)</text><line x1='380' y1='736' x2='420' y2='736' stroke='#212121' stroke-width='3'/><text x='426' y='740' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Direct-attach copper (DAC)</text><line x1='600' y1='736' x2='640' y2='736' stroke='#2e7d32' stroke-width='3'/><text x='646' y='740' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Existing user links</text><line x1='820' y1='736' x2='860' y2='736' stroke='#6a1b9a' stroke-width='3' stroke-dasharray='3 3'/><text x='866' y='740' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Management (BMC) Cat6</text></svg>
