<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 904' width='1000' height='904' font-family='Helvetica, Arial, sans-serif'><title>Power wiring</title><rect width='1000' height='904' fill='#ffffff'/><text x='30' y='34' font-size='20' text-anchor='start' font-weight='bold' fill='#111'>Power wiring: A and B feeds</text><text x='30' y='56' font-size='12' text-anchor='start' font-weight='normal' fill='#444'>Each device has two (or four) power supplies. Half go to PDU-A, half to PDU-B. Either feed alone carries the whole rack.</text><rect x='40' y='90' width='220' height='70' fill='#ffebee' stroke='#c62828' stroke-width='2' rx='6'/><text x='150' y='118' font-size='14' text-anchor='middle' font-weight='bold' fill='#c62828'>Facility feed A</text><text x='150' y='138' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>208V, existing, upstream of the PDU</text><text x='150' y='152' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>facilities switches it, confirm source</text><rect x='740' y='90' width='220' height='70' fill='#e3f2fd' stroke='#1565c0' stroke-width='2' rx='6'/><text x='850' y='118' font-size='14' text-anchor='middle' font-weight='bold' fill='#1565c0'>Facility feed B</text><text x='850' y='138' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>208V, existing, separate source</text><text x='850' y='152' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>facilities switches it, confirm source</text><rect x='40' y='210' width='220' height='60' fill='#ffcdd2' stroke='#c62828' stroke-width='2' rx='6'/><text x='150' y='236' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>PDU-A: existing Geist, rear left</text><text x='150' y='254' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>circuits 1-3, C13s + one C19 each</text><rect x='740' y='210' width='220' height='60' fill='#bbdefb' stroke='#1565c0' stroke-width='2' rx='6'/><text x='850' y='236' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>PDU-B: existing Geist, rear right</text><text x='850' y='254' font-size='11' text-anchor='middle' font-weight='normal' fill='#111'>circuits 1-3, C13s + one C19 each</text><line x1='150' y1='160' x2='150' y2='210' stroke='#c62828' stroke-width='4'/><line x1='850' y1='160' x2='850' y2='210' stroke='#1565c0' stroke-width='4'/><rect x='380' y='320' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='338' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>gpu01 GPU server</text><text x='500' y='355' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C19-C20 or C13-C14 (confirm), up to 2100 W</text><path d='M260 240 C 320 240, 320 342, 380 342' fill='none' stroke='#c62828' stroke-width='2'/><path d='M740 240 C 680 240, 680 342, 620 342' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='382' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='400' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc01 service node</text><text x='500' y='417' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C13 to C14, up to 400 W</text><path d='M260 240 C 320 240, 320 404, 380 404' fill='none' stroke='#c62828' stroke-width='2'/><path d='M740 240 C 680 240, 680 404, 620 404' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='444' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='462' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc02 service node</text><text x='500' y='479' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C13 to C14, up to 400 W</text><path d='M260 240 C 320 240, 320 466, 380 466' fill='none' stroke='#c62828' stroke-width='2'/><path d='M740 240 C 680 240, 680 466, 620 466' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='506' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='524' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>svc03 service node</text><text x='500' y='541' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C13 to C14, up to 400 W</text><path d='M260 240 C 320 240, 320 528, 380 528' fill='none' stroke='#c62828' stroke-width='2'/><path d='M740 240 C 680 240, 680 528, 620 528' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='568' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='586' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>sw01 lab switch</text><text x='500' y='603' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C13 to C14, up to 250 W</text><path d='M260 240 C 320 240, 320 590, 380 590' fill='none' stroke='#c62828' stroke-width='2'/><path d='M740 240 C 680 240, 680 590, 620 590' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='630' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='648' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>con01 rack console</text><text x='500' y='665' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>per vendor, up to 13 W</text><path d='M740 240 C 680 240, 680 652, 620 652' fill='none' stroke='#1565c0' stroke-width='2'/><rect x='380' y='692' width='240' height='44' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='4'/><text x='500' y='710' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>oob01 mgmt switch</text><text x='500' y='727' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#444'>C13 to C14, up to 30 W</text><path d='M260 240 C 320 240, 320 714, 380 714' fill='none' stroke='#c62828' stroke-width='2'/><rect x='281.4' y='349' width='93.6' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='358' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>PSU1 c1, PSU3 c2</text><rect x='624' y='349' width='93.6' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='358' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>PSU2 c1, PSU4 c2</text><rect x='331.8' y='411' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='420' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>PSU1 c1</text><rect x='624' y='411' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='420' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>PSU2 c1</text><rect x='331.8' y='473' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='482' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>PSU1 c2</text><rect x='624' y='473' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='482' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>PSU2 c2</text><rect x='331.8' y='535' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='544' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>PSU1 c3</text><rect x='624' y='535' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='544' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>PSU2 c3</text><rect x='331.8' y='597' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='606' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>PSU1 c3</text><rect x='624' y='597' width='43.199999999999996' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='606' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>PSU2 c3</text><rect x='624' y='659' width='71.19999999999999' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='626' y='668' font-size='10' text-anchor='start' font-weight='normal' fill='#1565c0'>only cord c3</text><rect x='303.8' y='721' width='71.19999999999999' height='12' fill='#ffffff' stroke='#ffffff' stroke-width='0' rx='0'/><text x='374' y='730' font-size='10' text-anchor='end' font-weight='normal' fill='#c62828'>only cord c3</text><text x='40' y='774' font-size='13' text-anchor='start' font-weight='bold' fill='#111'>Rules</text><text x='40' y='793' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>- Never plug both supplies of one device into the same PDU.</text><text x='40' y='812' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>- Label each cord at both ends: device, PSU number, PDU outlet (example: gpu01-PSU1 / A-c1-C19).</text><text x='40' y='831' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>- c1, c2, c3 = PDU circuit 1, 2, 3. Spread load across them; the PDU display shows current per circuit.</text><text x='40' y='850' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>- Test: facilities switches feed A off upstream; everything stays up. Restore. Repeat with feed B.</text><text x='40' y='869' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>- Each PDU must carry the whole rack alone: about 3.6 kW at 20 users. Confirm the PDU input rating on its label.</text></svg>
