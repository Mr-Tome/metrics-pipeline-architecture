<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 570' width='1100' height='570' font-family='Helvetica, Arial, sans-serif'><title>Software path</title><rect width='1100' height='570' fill='#ffffff'/><text x='30' y='34' font-size='20' text-anchor='start' font-weight='bold' fill='#111'>Software path: build workstation to the lab</text><text x='30' y='56' font-size='12' text-anchor='start' font-weight='normal' fill='#444'>No staging server. The build workstation rehearses each bundle; the lab rack is production from day 1.</text><rect x='30' y='80' width='1040' height='230' fill='#f1f8e9' stroke='#558b2f' stroke-width='2' rx='8'/><text x='46' y='102' font-size='13' text-anchor='start' font-weight='bold' fill='#33691e'>UNCLASSIFIED (internet)</text><rect x='60' y='130' width='300' height='96' fill='#fff3e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='210.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Build workstation</text><text x='210.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing Linux machine, 2 TB+ free disk</text><text x='210.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>runs delivery/pull-all.sh</text><text x='210.0' y='195' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>rehearses verify.sh + deploy.sh in a VM</text><rect x='460' y='130' width='240' height='96' fill='#fff9c4' stroke='#333' stroke-width='1.5' rx='6'/><text x='580.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Transfer drive</text><text x='580.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>Apricorn A25-3PL256-S4000F</text><text x='580.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>ext4, sealed bundle</text><text x='580.0' y='195' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>SHA256SUMS (+ signature)</text><rect x='800' y='130' width='240' height='96' fill='#f3e5f5' stroke='#333' stroke-width='1.5' rx='6'/><text x='920.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>ISSM intake</text><text x='920.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>approved media process</text><text x='920.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>scan with the bundled Trivy</text><text x='920.0' y='195' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>one way only: in</text><path d='M360 178 L460 178' fill='none' stroke='#2e7d32' stroke-width='2'/><path d='M700 178 L800 178' fill='none' stroke='#795548' stroke-width='2' stroke-dasharray='6 4'/><text x='60' y='260' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Rehearsal without a GPU catches most problems: missing images, checksum errors, script bugs, wrong versions.</text><text x='60' y='278' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>GPU driver and model problems first show up in the lab. The 4-GPU rolling update keeps users served while a new version proves itself.</text><rect x='30' y='340' width='1040' height='200' fill='#ffebee' stroke='#b71c1c' stroke-width='2' rx='8'/><text x='46' y='362' font-size='13' text-anchor='start' font-weight='bold' fill='#b71c1c'>LAB (AIR-GAPPED)</text><rect x='60' y='390' width='300' height='96' fill='#c8e6c9' stroke='#333' stroke-width='1.5' rx='6'/><text x='210.0' y='410' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Rack 1, production</text><text x='210.0' y='427' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>gpu01: 4 x RTX PRO 6000</text><text x='210.0' y='441' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>svc01-03: RKE2, gateway, database</text><text x='210.0' y='455' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>sw01 2 x 10G to the lab C9300-48S</text><rect x='460' y='390' width='240' height='96' fill='#bbdefb' stroke='#333' stroke-width='1.5' rx='6'/><text x='580.0' y='410' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Update, one GPU at a time</text><text x='580.0' y='427' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>vLLM replicas 3 -> new version on 1</text><text x='580.0' y='441' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>other 2 keep serving</text><text x='580.0' y='455' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>stalls if the new one fails</text><rect x='800' y='390' width='240' height='96' fill='#f3e5f5' stroke='#333' stroke-width='1.5' rx='6'/><text x='920.0' y='410' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Lab users</text><text x='920.0' y='427' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>browser, Jupyter, VS Code, MATLAB</text><text x='920.0' y='441' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>https://api.&lt;lab-domain&gt;/v1</text><text x='920.0' y='455' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>per-user gateway keys</text><path d='M920 226 L920 300 L210 300 L210 390' fill='none' stroke='#795548' stroke-width='2' stroke-dasharray='6 4'/><text x='565' y='294' font-size='11' text-anchor='middle' font-weight='bold' fill='#795548'>sealed release bundle on approved media</text><path d='M360 438 L460 438' fill='none' stroke='#212121' stroke-width='2'/><path d='M700 438 L800 438' fill='none' stroke='#2e7d32' stroke-width='2'/><text x='60' y='520' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>Lab hardware never connects to unclassified machines. Hardware and media only move one way: in.</text></svg>
