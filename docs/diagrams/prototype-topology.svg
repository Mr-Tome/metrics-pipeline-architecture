<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 580' width='1100' height='580' font-family='Helvetica, Arial, sans-serif'><title>Prototype topology</title><rect width='1100' height='580' fill='#ffffff'/><text x='30' y='34' font-size='20' text-anchor='start' font-weight='bold' fill='#111'>Prototype on the unclassified side (becomes staging)</text><text x='30' y='56' font-size='12' text-anchor='start' font-weight='normal' fill='#444'>The staging GPU server from the BOM is the prototype. It stays on the unclassified side for good. Nothing gets rebuilt later.</text><rect x='30' y='80' width='1040' height='330' fill='#f1f8e9' stroke='#558b2f' stroke-width='2' rx='8'/><text x='46' y='102' font-size='13' text-anchor='start' font-weight='bold' fill='#33691e'>UNCLASSIFIED</text><rect x='60' y='130' width='250' height='80' fill='#fff3e0' stroke='#333' stroke-width='1.5' rx='6'/><text x='185.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Build workstation</text><text x='185.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>internet access</text><text x='185.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>runs delivery/ pull scripts</text><text x='185.0' y='195' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>existing machine, 2 TB+ free disk</text><rect x='420' y='130' width='280' height='80' fill='#c8e6c9' stroke='#333' stroke-width='1.5' rx='6'/><text x='560.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>stg01 staging GPU server</text><text x='560.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>BOM items S1, S2, S3</text><text x='560.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>1 x RTX PRO 6000, RKE2 single node</text><text x='560.0' y='195' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>2 x 25G NIC</text><rect x='800' y='130' width='240' height='80' fill='#f3e5f5' stroke='#333' stroke-width='1.5' rx='6'/><text x='920.0' y='150' font-size='13' text-anchor='middle' font-weight='bold' fill='#111'>Unclass workstation(s)</text><text x='920.0' y='167' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>prototype users</text><text x='920.0' y='181' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>browser, Jupyter, VS Code</text><path d='M310 160 L420 160' fill='none' stroke='#2e7d32' stroke-width='2'/><text x='365' y='152' font-size='10' text-anchor='middle' font-weight='normal' fill='#2e7d32'>Phase P1 only</text><text x='365' y='178' font-size='10' text-anchor='middle' font-weight='normal' fill='#2e7d32'>LAN, pulls direct</text><path d='M185 210 L185 300 L560 300 L560 210' fill='none' stroke='#795548' stroke-width='2' stroke-dasharray='6 4'/><text x='372' y='292' font-size='11' text-anchor='middle' font-weight='normal' fill='#795548'>Phase P2+: approved transfer media only (same as the lab)</text><path d='M700 170 L800 170' fill='none' stroke='#212121' stroke-width='3'/><text x='750' y='162' font-size='10' text-anchor='middle' font-weight='normal' fill='#111'>Direct cable</text><text x='750' y='190' font-size='10' text-anchor='middle' font-weight='normal' fill='#111'>25G DAC or 10G</text><text x='60' y='345' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>Direct cable option: one workstation plugs straight into stg01's second 25G port with a DAC (or 10G SFP+ if</text><text x='60' y='361' font-size='11' text-anchor='start' font-weight='normal' fill='#111'>the workstation only has 10G). Static IPs, no switch. For more than one or two users, use the unclassified LAN instead.</text><text x='60' y='385' font-size='11' text-anchor='start' font-weight='bold' fill='#111'>Either way, users hit the same LiteLLM gateway URL and API keys they will use in the lab.</text><rect x='30' y='440' width='1040' height='110' fill='#ffebee' stroke='#b71c1c' stroke-width='2' rx='8'/><text x='46' y='462' font-size='13' text-anchor='start' font-weight='bold' fill='#b71c1c'>LAB (CLASSIFIED / AIR-GAPPED)</text><text x='60' y='490' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>Lab GPU servers never connect to unclassified machines once they are in the lab. Hardware and media only move one way: in.</text><text x='60' y='510' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>Optional, with ISSM approval: burn in new lab hardware on the unclassified side BEFORE it enters the lab (catch dead parts early).</text><text x='60' y='530' font-size='12' text-anchor='start' font-weight='normal' fill='#111'>Software reaches the lab only as a sealed, checksummed release bundle that already passed staging.</text><text x='560' y='428' font-size='11' text-anchor='middle' font-weight='bold' fill='#795548'>one way only: sealed release bundle on approved media, after staging sign-off</text></svg>
